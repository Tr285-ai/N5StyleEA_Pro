# config/update_config.yaml
# Auto-update configuration
check_interval: 3600  # Check for updates every hour (in seconds)
auto_install: false   # Whether to install updates automatically
backup_before_update: true  # Create backup before updating
notify_on_update: true  # Send notification when updates are available

# Repository configuration
repository: https://api.github.com/repos/yourusername/yourrepo
branch: main

# Update channels
channels:
  - name: stable
    branch: main
    auto_install: false
    
  - name: beta
    branch: develop
    auto_install: false

# Dependencies
dependencies:
  required:
    - python>=3.8
    - torch>=1.9.0
    - pandas>=1.3.0
    
  optional:
    - tensorflow>=2.6.0
    - plotly>=5.3.0

# Files to exclude from updates
exclude:
  - "config/*.yaml"
  - "*.db"
  - "data/**"
  - "logs/**"

# Post-update commands
post_update:
  - "pip install -r requirements.txt"
  - "python -m pip install --upgrade pip"

# Notifications
notifications:
  email:
    enabled: false
    smtp_server: smtp.example.com
    smtp_port: 587
    username: user@example.com
    password: your_password
    recipients:
      - admin@example.com
      
  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/..."
    channel: "#alerts"