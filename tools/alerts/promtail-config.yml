server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tca-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: tca
          __path__: /app/logs/tca.jsonl
    pipeline_stages:
      - json
      - labels:
          event:
          symbol:
          side:
      - timestamp:
          source: timestamp
          format: RFC3339
