<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N5StyleEA Pro v15.3 - Trading Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <header class="py-3 mb-4 border-bottom">
            <div class="container d-flex flex-wrap justify-content-between align-items-center">
                <h1 class="h4 mb-0">N5StyleEA Pro <span class="badge bg-primary">v15.3</span></h1>
                <div class="d-flex align-items-center">
                    <span id="status-indicator" class="status-indicator status-disconnected me-2" title="Disconnected"></span>
                    <button id="connect-btn" class="btn btn-sm btn-outline-primary me-2">Connect</button>
                    <button id="start-trading-btn" class="btn btn-sm btn-success" disabled>Start Trading</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="row">
            <!-- Left Sidebar -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header">Account</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Balance</label>
                            <h4 id="account-balance">$0.00</h4>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Equity</label>
                            <h5 id="account-equity">$0.00</h5>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Margin</label>
                            <h5 id="account-margin">$0.00</h5>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">Trading Pair</div>
                    <div class="card-body">
                        <select class="form-select mb-3" id="trading-pair">
                            <option value="BTC/USDT">BTC/USDT</option>
                            <option value="ETH/USDT">ETH/USDT</option>
                            <option value="XRP/USDT">XRP/USDT</option>
                        </select>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="auto-trading">
                            <label class="form-check-label" for="auto-trading">Auto Trading</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Chart Area -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Price Chart</span>
                        <div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary" data-timeframe="1m">1m</button>
                                <button class="btn btn-outline-secondary" data-timeframe="5m">5m</button>
                                <button class="btn btn-outline-secondary active" data-timeframe="15m">15m</button>
                                <button class="btn btn-outline-secondary" data-timeframe="1h">1h</button>
                                <button class="btn btn-outline-secondary" data-timeframe="4h">4h</button>
                                <button class="btn btn-outline-secondary" data-timeframe="1d">1D</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" style="position: relative; height: 400px;">
                            <canvas id="price-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header">Open Positions</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Pair</th>
                                        <th>Side</th>
                                        <th>Size</th>
                                        <th>P/L</th>
                                    </tr>
                                </thead>
                                <tbody id="positions-table">
                                    <!-- Filled by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">Trading Logs</div>
                    <div class="card-body p-0">
                        <div id="logs" class="logs-container">
                            <!-- Logs will be added here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.0.2/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.1.0/dist/chartjs-adapter-luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.0.2/dist/chartjs-plugin-annotation.min.js"></script>
    
    <!-- Application Script -->
    <script src="/static/js/app.js"></script>
</body>
</html>
