[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; One-shot migration task (run manually when needed)
[program:migrate]
command=/bin/sh -lc "alembic upgrade head"
directory=.
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"
priority=10
stdout_logfile=logs/migrate.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=logs/migrate.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; FastAPI app under Uvicorn with automatic restart
[program:app]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=.
autostart=true
autorestart=true
startsecs=5
startretries=999
stopasgroup=true
killasgroup=true
; Keep supervisor logs bounded (app also rotates its own logs via TimedRotatingFileHandler)
stdout_logfile=logs/uvicorn.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=logs/uvicorn.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7
environment=PYTHONUNBUFFERED="1",DB_MIGRATE_ON_START="1"

[group:trading]
programs=app
