name: Test Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, windows, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # Matches your 3.12.10

      - name: Debug import path
        run: |
          pwd
          python -c "import sys; print('sys.path:\n' + '\n'.join(sys.path))"
          ls -la streaming || echo "No streaming folder visible"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest              # Add more if needed, e.g. pip install -r requirements.txt

      - name: Run pytest with PYTHONPATH set to repo root
        run: pytest -q tests/chaos/test_ws_chaos_mttr.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}   # ← Key fix: adds repo root to sys.path
