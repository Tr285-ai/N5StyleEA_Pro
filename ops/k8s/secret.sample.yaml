apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: "n5trading"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-conn
type: Opaque
stringData:
  ORDERS_DB_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/n5trading"
