apiVersion: 1

# Provision Prometheus and Loki as Grafana datasources
# Loaded at Grafana startup via docker-compose.observability.yml

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: GET

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
