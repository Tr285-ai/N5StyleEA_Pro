name: Nightly Chaos MTTR

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  chaos:
    name: Chaos WS MTTR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pandas numpy
      - name: Run chaos MTTR test
        run: |
          pytest -q tests/chaos/test_ws_chaos_mttr.py -q
      - name: Upload chaos artifacts (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-chaos-artifacts
          path: artifacts/chaos/ws_chaos_mttr.json
          if-no-files-found: warn
