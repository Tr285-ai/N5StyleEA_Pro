name: CD Local Docker

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  deploy-local:
    name: Deploy to Docker Desktop (self-hosted)
    runs-on: [self-hosted, windows, docker]
    env:
      CONTAINER_NAME: n5styleea-app
      PORT_APP: 8000
      PORT_METRICS: 9100
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image reference (pull or build)
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}".ToLower()
          $candidates = New-Object System.Collections.Generic.List[string]
          if ($env:GITHUB_REF -like 'refs/tags/*') { $candidates.Add("ghcr.io/$repo:$env:GITHUB_REF_NAME") }
          $candidates.Add("ghcr.io/$repo:${{ github.sha }}")
          $candidates.Add("ghcr.io/$repo:latest")

          $image = $null
          foreach ($cand in $candidates) {
            Write-Host "Trying to pull $cand"
            docker pull $cand 2>$null
            if ($LASTEXITCODE -eq 0) { $image = $cand; break }
          }

          if (-not $image) {
            $fallback = "localapp:${{ github.sha }}"
            $dockerfile = if (Test-Path 'Dockerfile') { 'Dockerfile' } elseif (Test-Path 'Dockerfile.prod') { 'Dockerfile.prod' } else { 'Dockerfile' }
            Write-Host "No remote image found; building locally as $fallback using $dockerfile"
            docker build -f $dockerfile -t $fallback .
            if ($LASTEXITCODE -ne 0) { throw "Local build failed" }
            $image = $fallback
          }

          echo "IMAGE=$image" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure admin token file exists
        shell: pwsh
        run: |
          $tokenPath = Join-Path $env:GITHUB_WORKSPACE 'ops/prometheus/secrets/admin_token'
          New-Item -ItemType Directory -Path (Split-Path $tokenPath) -Force | Out-Null
          if (-not (Test-Path $tokenPath)) {
            [IO.File]::WriteAllText($tokenPath, [Guid]::NewGuid().ToString('N'))
          }

      - name: Stop and remove existing container (if any)
        shell: pwsh
        continue-on-error: true
        run: |
          $id = (docker ps -aq -f "name=${{ env.CONTAINER_NAME }}")
          if ($id) { docker rm -f $id }

      - name: Run container
        shell: pwsh
        run: |
          $tokenPath = Join-Path $env:GITHUB_WORKSPACE 'ops/prometheus/secrets/admin_token'
          docker run -d --name $Env:CONTAINER_NAME `
            -p "$Env:PORT_APP:8000" -p "$Env:PORT_METRICS:9100" `
            -v "$tokenPath:/run/secrets/admin_token:ro" `
            -e ADMIN_TOKEN_FILE=/run/secrets/admin_token `
            -e UVLOOP_ENABLE=1 `
            $Env:IMAGE

      - name: Health check
        shell: pwsh
        run: |
          Start-Sleep -Seconds 6
          (Invoke-WebRequest -Uri "http://127.0.0.1:$Env:PORT_APP/health" -UseBasicParsing).Content | Out-File -FilePath health.json -Encoding utf8

      - name: Metrics check (bearer)
        shell: pwsh
        continue-on-error: true
        run: |
          $adminToken = Get-Content "$env:GITHUB_WORKSPACE/ops/prometheus/secrets/admin_token" -Raw
          $headers = @{ Authorization = "Bearer $adminToken" }
          (Invoke-WebRequest -Uri "http://127.0.0.1:$Env:PORT_APP/metrics" -Headers $headers -UseBasicParsing).Content | Select-Object -First 100 | Out-File -FilePath metrics.txt -Encoding utf8

      - name: Upload local deploy artifacts (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-deploy-artifacts
          path: |
            health.json
            metrics.txt
