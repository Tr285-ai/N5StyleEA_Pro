apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL:http://prometheus:9090}
    isDefault: true
    editable: true
    jsonData:
      httpMethod: GET
      timeInterval: 15s
  - name: Loki
    type: loki
    access: proxy
    url: ${LOKI_URL:http://loki:3100}
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields: []
