global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: default-slack
  routes:
    - matchers: [severity="critical"]
      receiver: pd-and-slack
    - matchers: [severity="warning"]
      receiver: slack-and-telegram

receivers:
  - name: default-slack
    slack_configs:
      - send_resolved: true
        channel: '#trading-alerts'
        api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        text: |
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}• {{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}

  - name: pd-and-slack
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }} - {{ .CommonAnnotations.description }}'
    slack_configs:
      - send_resolved: true
        channel: '#trading-critical'
        api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        text: |
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}• {{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}

  - name: slack-and-telegram
    slack_configs:
      - send_resolved: true
        channel: '#trading-alerts'
        api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        text: |
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}• {{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 12345678
        parse_mode: ''
        message: |
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}• {{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}
