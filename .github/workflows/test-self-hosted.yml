name: Test Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, windows, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest  # add any other test deps here

      - name: Run pytest with explicit sys.path fix
        shell: pwsh   # Use PowerShell on Windows runner.
        run: |
          $repoRoot = "${{ github.workspace }}"
          python -c "import sys; sys.path.insert(0, '$repoRoot'); print('Updated sys.path:', sys.path)"  # Debug: print path
          python -m pytest -q tests/chaos/test_ws_chaos_mttr.py -q