name: Test Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, windows, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest  # add more packages here if your test needs them

      - name: Run pytest (with repo root in PYTHONPATH)
        run: pytest -q tests/chaos/test_ws_chaos_mttr.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}  # ← This adds C:\actions-runner\_work\...\repo to sys.path

      # Optional debug – keep for now to verify
      - name: Debug Python environment (before pytest)
        run: |
          pwd
          python -c "import sys; print('sys.path:\n' + '\n'.join(sys.path))"
